<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Ideas Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --border: #2a2a3d;
    --accent: #7c6aff;
    --accent2: #ff6a9e;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --green: #4fffb0;
    --red: #ff4f6a;
    --hametradie: #ff9f43;
    --superx: #7c6aff;
    --quoter: #4fffb0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 100px;
    min-height: 100vh;
  }

  /* Header */
  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .date-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* Tabs */
  .tabs {
    display: flex;
    padding: 16px 20px 0;
    gap: 0;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* Record screen */
  .screen { display: none; padding: 24px 20px; }
  .screen.active { display: block; }

  /* Record button area */
  .record-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 0 32px;
    gap: 16px;
  }

  .record-btn {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.2s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .record-btn::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.3s;
  }

  .record-btn.recording::before {
    border-color: var(--red);
    inset: -8px;
    animation: ring 1.5s ease infinite;
  }

  @keyframes ring {
    0%, 100% { opacity: 1; inset: -8px; }
    50% { opacity: 0.3; inset: -12px; }
  }

  .record-btn svg { transition: all 0.2s; }

  .record-btn.recording { background: rgba(255,79,106,0.15); }
  .record-btn:active { transform: scale(0.95); }

  .record-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .record-label.recording { color: var(--red); }

  .timer {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    min-height: 36px;
  }

  /* Waveform */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 40px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .waveform.active { opacity: 1; }

  .wave-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    height: 4px;
    transition: height 0.1s;
  }

  /* Transcript box */
  .transcript-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    min-height: 100px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    position: relative;
    margin-bottom: 16px;
  }

  .transcript-placeholder {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  .transcript-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* AI Processing */
  .ai-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }

  .ai-section.visible { display: block; }

  .ai-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .ai-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  .ai-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .ai-thinking {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .ai-thinking span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: thinking 1.2s ease infinite;
  }

  .ai-thinking span:nth-child(2) { animation-delay: 0.2s; }
  .ai-thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes thinking {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* Project proposal */
  .project-proposal {
    display: none;
  }

  .project-proposal.visible { display: block; }

  .proposal-text {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .proposal-text strong { color: var(--text); }

  .project-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .project-chip {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .project-chip[data-project="HameTradie"] {
    background: rgba(255,159,67,0.1);
    color: var(--hametradie);
    border-color: rgba(255,159,67,0.3);
  }

  .project-chip[data-project="SuperX"] {
    background: rgba(124,106,255,0.1);
    color: var(--superx);
    border-color: rgba(124,106,255,0.3);
  }

  .project-chip[data-project="Quoter"] {
    background: rgba(79,255,176,0.1);
    color: var(--quoter);
    border-color: rgba(79,255,176,0.3);
  }

  .project-chip[data-project="Inne"] {
    background: rgba(107,107,138,0.1);
    color: var(--muted);
    border-color: rgba(107,107,138,0.3);
  }

  .project-chip.selected[data-project="HameTradie"] { background: rgba(255,159,67,0.25); border-color: var(--hametradie); }
  .project-chip.selected[data-project="SuperX"] { background: rgba(124,106,255,0.25); border-color: var(--superx); }
  .project-chip.selected[data-project="Quoter"] { background: rgba(79,255,176,0.25); border-color: var(--quoter); }
  .project-chip.selected[data-project="Inne"] { background: rgba(107,107,138,0.25); border-color: var(--muted); }

  /* Summary */
  .summary-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }

  .summary-box.visible { display: block; }

  .summary-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .summary-content {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:active { opacity: 0.85; transform: scale(0.99); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    margin-top: 10px;
  }

  .btn-copy {
    background: var(--green);
    color: #0a0a0f;
    margin-top: 10px;
  }

  .btn-copy:active { opacity: 0.85; }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Markdown output */
  .markdown-output {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 12px;
    display: none;
    max-height: 200px;
    overflow-y: auto;
  }

  .markdown-output.visible { display: block; }

  /* History screen */
  .history-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .history-empty .icon { font-size: 40px; margin-bottom: 12px; }
  .history-empty p { font-size: 14px; }

  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .note-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .note-project-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-HameTradie { background: rgba(255,159,67,0.15); color: var(--hametradie); }
  .badge-SuperX { background: rgba(124,106,255,0.15); color: var(--superx); }
  .badge-Quoter { background: rgba(79,255,176,0.15); color: var(--quoter); }
  .badge-Inne { background: rgba(107,107,138,0.15); color: var(--muted); }

  .note-time {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .note-summary {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 10px;
  }

  .note-actions {
    display: flex;
    gap: 8px;
  }

  .btn-small {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s;
  }

  .btn-small:active { opacity: 0.7; }
  .btn-small.green { color: var(--green); border-color: rgba(79,255,176,0.3); }

  /* Error */
  .error-msg {
    background: rgba(255,79,106,0.1);
    border: 1px solid rgba(255,79,106,0.3);
    color: var(--red);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  .error-msg.visible { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green);
    color: #0a0a0f;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s;
  }

  .nav-icon { font-size: 20px; }
  .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
  .nav-item.active .nav-label { color: var(--accent); }

  .note-count {
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      Ideas Vault
    </div>
    <div class="date-badge" id="dateBadge"></div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('record')">Nagraj</div>
    <div class="tab" onclick="switchTab('history')">Historia <span class="note-count" id="noteCount">0</span></div>
  </div>

  <!-- RECORD SCREEN -->
  <div class="screen active" id="screen-record">
    <div class="record-area">
      <div class="timer" id="timer">0:00</div>
      <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
        <svg id="micIcon" width="36" height="36" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="#7c6aff"/>
          <path d="M5 10a7 7 0 0014 0" stroke="#7c6aff" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="17" x2="12" y2="21" stroke="#7c6aff" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="21" x2="15" y2="21" stroke="#7c6aff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg id="stopIcon" width="36" height="36" viewBox="0 0 24 24" fill="none" style="display:none">
          <rect x="6" y="6" width="12" height="12" rx="2" fill="#ff4f6a"/>
        </svg>
      </button>
      <div class="record-label" id="recordLabel">NACIŚNIJ ABY NAGRAĆ</div>
      <div class="waveform" id="waveform">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Transcript -->
    <div id="transcriptSection" style="display:none">
      <div class="transcript-label">Transkrypcja</div>
      <div class="transcript-box">
        <div id="transcriptText" class="transcript-placeholder">Trwa transkrypcja...</div>
      </div>

      <!-- AI Analysis -->
      <div class="ai-section visible" id="aiSection">
        <div class="ai-header">
          <div class="ai-dot"></div>
          <div class="ai-label">Claude analizuje</div>
        </div>
        <div class="ai-thinking" id="aiThinking">
          <span></span><span></span><span></span>
        </div>

        <div class="project-proposal" id="projectProposal">
          <div class="proposal-text" id="proposalText"></div>
          <div class="project-chips">
            <div class="project-chip" data-project="HameTradie" onclick="selectProject(this)">HameTradie</div>
            <div class="project-chip" data-project="SuperX" onclick="selectProject(this)">SuperX</div>
            <div class="project-chip" data-project="Quoter" onclick="selectProject(this)">Quoter</div>
            <div class="project-chip" data-project="Inne" onclick="selectProject(this)">Inne</div>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="summary-box" id="summaryBox">
        <div class="summary-title">Skrót pomysłu</div>
        <div class="summary-content" id="summaryContent"></div>
      </div>

      <!-- Markdown output -->
      <div class="transcript-label" id="mdLabel" style="display:none">Markdown dla Obsidian</div>
      <div class="markdown-output" id="markdownOutput"></div>

      <button class="btn btn-copy" id="copyBtn" onclick="copyMarkdown()" style="display:none">
        📋 Kopiuj Markdown do schowka
      </button>
      <button class="btn btn-secondary" onclick="resetAll()">Nagraj kolejny pomysł</button>
    </div>
  </div>

  <!-- HISTORY SCREEN -->
  <div class="screen" id="screen-history">
    <div id="historyEmpty" class="history-empty">
      <div class="icon">🎙️</div>
      <p>Brak nagranych pomysłów.<br>Zacznij od nagrania pierwszego!</p>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('record')">
    <div class="nav-icon">🎙️</div>
    <div class="nav-label">Nagraj</div>
  </div>
  <div class="nav-item" onclick="switchTab('history')">
    <div class="nav-icon">📋</div>
    <div class="nav-label">Historia</div>
  </div>
</nav>

<script>
const ANTHROPIC_API = 'https://api.anthropic.com/v1/messages';
const PROJECTS = ['HameTradie', 'SuperX', 'Quoter', 'Inne'];

let mediaRecorder = null;
let audioChunks = [];
let timerInterval = null;
let seconds = 0;
let isRecording = false;
let currentTranscript = '';
let currentProject = '';
let currentSummary = '';
let currentMarkdown = '';
let waveInterval = null;
let notes = JSON.parse(localStorage.getItem('ideasVaultNotes') || '[]');

// Init
document.getElementById('dateBadge').textContent = new Date().toLocaleDateString('pl-PL', {day:'numeric',month:'short',year:'numeric'});
updateNoteCount();

function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  const tabs = document.querySelectorAll('.tab');
  const navItems = document.querySelectorAll('.nav-item');
  if (tab === 'record') { tabs[0].classList.add('active'); navItems[0].classList.add('active'); }
  else { tabs[1].classList.add('active'); navItems[1].classList.add('active'); renderHistory(); }
}

async function toggleRecord() {
  if (!isRecording) {
    await startRecording();
  } else {
    stopRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start();

    isRecording = true;
    document.getElementById('recordBtn').classList.add('recording');
    document.getElementById('micIcon').style.display = 'none';
    document.getElementById('stopIcon').style.display = 'block';
    document.getElementById('recordLabel').textContent = 'NAGRYWAM... NACIŚNIJ ABY ZATRZYMAĆ';
    document.getElementById('recordLabel').classList.add('recording');
    document.getElementById('waveform').classList.add('active');
    document.getElementById('transcriptSection').style.display = 'none';
    document.getElementById('errorMsg').classList.remove('visible');

    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds/60);
      const s = seconds % 60;
      document.getElementById('timer').textContent = m + ':' + String(s).padStart(2,'0');
    }, 1000);

    animateWave();
  } catch(e) {
    showError('Brak dostępu do mikrofonu. Sprawdź uprawnienia w Chrome.');
  }
}

function animateWave() {
  const bars = document.querySelectorAll('.wave-bar');
  waveInterval = setInterval(() => {
    bars.forEach(bar => {
      const h = Math.random() * 28 + 4;
      bar.style.height = h + 'px';
    });
  }, 120);
}

function stopRecording() {
  if (mediaRecorder) {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  clearInterval(timerInterval);
  clearInterval(waveInterval);
  isRecording = false;
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('micIcon').style.display = 'block';
  document.getElementById('stopIcon').style.display = 'none';
  document.getElementById('recordLabel').textContent = 'NACIŚNIJ ABY NAGRAĆ';
  document.getElementById('recordLabel').classList.remove('recording');
  document.getElementById('waveform').classList.remove('active');
  document.querySelectorAll('.wave-bar').forEach(b => b.style.height = '4px');
}

async function handleRecordingStop() {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  document.getElementById('transcriptSection').style.display = 'block';
  document.getElementById('transcriptText').textContent = 'Trwa transkrypcja...';
  document.getElementById('transcriptText').className = 'transcript-placeholder';
  document.getElementById('aiSection').classList.add('visible');
  document.getElementById('aiThinking').style.display = 'flex';
  document.getElementById('projectProposal').classList.remove('visible');
  document.getElementById('summaryBox').classList.remove('visible');
  document.getElementById('markdownOutput').classList.remove('visible');
  document.getElementById('copyBtn').style.display = 'none';
  document.getElementById('mdLabel').style.display = 'none';

  // Convert audio to base64
  const reader = new FileReader();
  reader.onloadend = async () => {
    const base64Audio = reader.result.split(',')[1];
    await transcribeAndAnalyze(base64Audio);
  };
  reader.readAsDataURL(blob);
}

async function transcribeAndAnalyze(base64Audio) {
  try {
    // Step 1: Transcribe using Claude
    const transcribeResp = await fetch(ANTHROPIC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: 'Transkrybuj dokładnie to nagranie głosowe po polsku. Zwróć TYLKO transkrypcję tekstu, bez żadnych komentarzy, cudzysłowów ani dodatkowych słów.' },
            { type: 'document', source: { type: 'base64', media_type: 'audio/webm', data: base64Audio } }
          ]
        }]
      })
    });

    if (!transcribeResp.ok) throw new Error('Błąd transkrypcji');
    const transcribeData = await transcribeResp.json();
    currentTranscript = transcribeData.content[0].text.trim();

    document.getElementById('transcriptText').textContent = currentTranscript;
    document.getElementById('transcriptText').className = '';

    // Step 2: Analyze with Claude
    const analyzeResp = await fetch(ANTHROPIC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `Masz następującą notatkę głosową: "${currentTranscript}"

Projekty użytkownika: HameTradie (aplikacja dla tradies/rzemieślników), SuperX (projekt X), Quoter (wyceniarka/quoter).

Odpowiedz TYLKO w formacie JSON (bez markdown, bez backticks):
{
  "project": "HameTradie|SuperX|Quoter|Inne",
  "confidence": "wysoka|średnia|niska",
  "reason": "krótkie uzasadnienie po polsku (max 15 słów)",
  "summary": "1-2 zdania po polsku opisujące pomysł",
  "title": "krótki tytuł po polsku (max 5 słów)",
  "tags": ["tag1", "tag2", "tag3"]
}`
        }]
      })
    });

    if (!analyzeResp.ok) throw new Error('Błąd analizy');
    const analyzeData = await analyzeResp.json();
    const raw = analyzeData.content[0].text.trim();
    const analysis = JSON.parse(raw);

    currentSummary = analysis.summary;

    document.getElementById('aiThinking').style.display = 'none';
    document.getElementById('projectProposal').classList.add('visible');

    const confidenceText = analysis.confidence === 'wysoka' ? '✓ Pewna propozycja' : analysis.confidence === 'średnia' ? '~ Prawdopodobnie' : '? Możliwe';
    document.getElementById('proposalText').innerHTML = `<strong>${confidenceText}:</strong> ${analysis.reason}. Potwierdź lub zmień projekt:`;

    // Pre-select proposed project
    document.querySelectorAll('.project-chip').forEach(chip => chip.classList.remove('selected'));
    const proposed = document.querySelector(`.project-chip[data-project="${analysis.project}"]`);
    if (proposed) { proposed.classList.add('selected'); currentProject = analysis.project; }

    document.getElementById('summaryBox').classList.add('visible');
    document.getElementById('summaryContent').textContent = analysis.summary;

    generateMarkdown(analysis);

  } catch(e) {
    // Fallback: show transcript, let user pick manually
    if (currentTranscript) {
      document.getElementById('aiThinking').style.display = 'none';
      document.getElementById('projectProposal').classList.add('visible');
      document.getElementById('proposalText').innerHTML = 'Nie udało się przeanalizować automatycznie. Wybierz projekt ręcznie:';
      document.getElementById('summaryBox').classList.add('visible');
      document.getElementById('summaryContent').textContent = currentTranscript;
    } else {
      showError('Wystąpił błąd. Sprawdź połączenie i spróbuj ponownie.');
      document.getElementById('transcriptSection').style.display = 'none';
    }
  }
}

function generateMarkdown(analysis) {
  const now = new Date();
  const date = now.toISOString().split('T')[0];
  const time = now.toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit'});
  const tags = (analysis.tags || []).map(t => '#'+t).join(' ');

  currentMarkdown = `# ${analysis.title || 'Pomysł'}

**Data:** ${date} ${time}
**Projekt:** ${analysis.project || currentProject}
**Tagi:** ${tags}

## Pomysł
${analysis.summary || currentTranscript}

## Transkrypcja (oryginał)
> ${currentTranscript}
`;

  document.getElementById('markdownOutput').textContent = currentMarkdown;
  document.getElementById('markdownOutput').classList.add('visible');
  document.getElementById('mdLabel').style.display = 'block';
  document.getElementById('copyBtn').style.display = 'block';
}

function selectProject(chip) {
  document.querySelectorAll('.project-chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  currentProject = chip.dataset.project;

  // Regenerate markdown with new project
  if (currentMarkdown) {
    currentMarkdown = currentMarkdown.replace(/\*\*Projekt:\*\* .+/, `**Projekt:** ${currentProject}`);
    document.getElementById('markdownOutput').textContent = currentMarkdown;
  }
}

function copyMarkdown() {
  if (!currentMarkdown) return;

  // Save to history
  const note = {
    id: Date.now(),
    project: currentProject,
    summary: currentSummary || currentTranscript.substring(0, 100),
    markdown: currentMarkdown,
    transcript: currentTranscript,
    time: new Date().toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit'}),
    date: new Date().toLocaleDateString('pl-PL')
  };
  notes.unshift(note);
  localStorage.setItem('ideasVaultNotes', JSON.stringify(notes));
  updateNoteCount();

  navigator.clipboard.writeText(currentMarkdown).then(() => {
    showToast('✓ Skopiowano do schowka!');
  }).catch(() => {
    showToast('Zaznacz tekst i skopiuj ręcznie');
  });
}

function resetAll() {
  currentTranscript = '';
  currentProject = '';
  currentSummary = '';
  currentMarkdown = '';
  seconds = 0;
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('transcriptSection').style.display = 'none';
  document.getElementById('errorMsg').classList.remove('visible');
  document.querySelectorAll('.project-chip').forEach(c => c.classList.remove('selected'));
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');
  if (notes.length === 0) { empty.style.display = 'block'; list.innerHTML = ''; return; }
  empty.style.display = 'none';
  list.innerHTML = notes.map(note => `
    <div class="note-card">
      <div class="note-card-header">
        <span class="note-project-badge badge-${note.project}">${note.project}</span>
        <span class="note-time">${note.date} ${note.time}</span>
      </div>
      <div class="note-summary">${note.summary}</div>
      <div class="note-actions">
        <button class="btn-small green" onclick="copyNote(${note.id})">📋 Kopiuj MD</button>
        <button class="btn-small" onclick="deleteNote(${note.id})">🗑 Usuń</button>
      </div>
    </div>
  `).join('');
}

function copyNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  navigator.clipboard.writeText(note.markdown).then(() => showToast('✓ Skopiowano!')).catch(() => {});
}

function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  localStorage.setItem('ideasVaultNotes', JSON.stringify(notes));
  updateNoteCount();
  renderHistory();
}

function updateNoteCount() {
  document.getElementById('noteCount').textContent = notes.length;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
